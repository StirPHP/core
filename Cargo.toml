[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = ""
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Internal crates: versionless paths, so they always are this workspace's version.
stir_checker = { path = "crates/stir_checker" }
stir_composer = { path = "crates/stir_composer" }
stir_db = { path = "crates/stir_db" }
stir_fmt = { path = "crates/stir_fmt" }
stir_hir = { path = "crates/stir_hir" }
stir_lsp = { path = "crates/stir_lsp", default-features = false }
stir_phpstan = { path = "crates/stir_phpstan" }
stir_neon = { path = "crates/stir_neon" }
stir_phpdoc = { path = "crates/stir_phpdoc" }
stir_project = { path = "crates/stir_project", default-features = false }
stir_script = { path = "crates/stir_script" }
stir_stubs = { path = "crates/stir_stubs" }
stir_syntax = { path = "crates/stir_syntax" }
stir_types = { path = "crates/stir_types" }
stir_vfs = { path = "crates/stir_vfs" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Release binaries: `cargo build --profile dist`
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# The browser build (`just web`): small, since it's downloaded
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "s"
