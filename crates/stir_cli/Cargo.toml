[package]
name = "stir_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
ariadne = "0.6.0"
clap.workspace = true
futures = "0.3.34"
inquire = "0.9.4"
notify-debouncer-full = "0.7.0"
pathdiff = "0.2.3"
salsa = "0.28.5"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sourcemap = "9.3.2"
stir_checker.workspace = true
stir_db.workspace = true
stir_emit.workspace = true
stir_lsp = { workspace = true, features = ["server"] }
stir_project.workspace = true
stir_syntax.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# musl's allocator is slow for a multi-threaded compiler: static musl builds
# use mimalloc instead
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"

[lints]
workspace = true

[[bin]]
name = "sphp"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
