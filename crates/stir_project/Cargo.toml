[package]
name = "stir_project"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
futures = "0.3.34"
globset = "0.4.21"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stir_db = { version = "0.1.0", path = "../stir_db" }
stir_neon = { version = "0.1.0", path = "../stir_neon" }
stir_stubs = { version = "0.1.0", path = "../stir_stubs" }
stir_syntax = { version = "0.1.0", path = "../stir_syntax" }
thiserror = "2.0.21"
tokio = { workspace = true, features = ["fs", "rt", "macros"] }
toml = "1.1.8"
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = ["full"] }
