[package]
name = "stir_phpstan"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Runs a project's PHPStan and merges what it reports with our own diagnostics. Native only: there's no process to run in a browser."

[dependencies]
rustc-hash = "2.1.3"
serde_json = "1.0.154"
stir_db.workspace = true
stir_neon.workspace = true
stir_project.workspace = true
stir_syntax.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
