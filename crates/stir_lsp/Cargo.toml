[package]
name = "stir_lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
line-index = "0.1.2"
ls-types = "0.0.6"
rustc-hash = "2.1.3"
salsa = "0.28.5"
serde_json = { version = "1.0.154", optional = true }
smol_str = "0.3.7"
stir_checker = { version = "0.1.0", path = "../stir_checker" }
stir_db = { version = "0.1.0", path = "../stir_db" }
stir_hir = { version = "0.1.0", path = "../stir_hir" }
stir_project = { version = "0.1.0", path = "../stir_project", optional = true }
stir_syntax = { version = "0.1.0", path = "../stir_syntax" }
stir_types = { version = "0.1.0", path = "../stir_types" }
tokio = { workspace = true, optional = true }
tower-lsp-server = { version = "0.23.0", optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["server"]
# The LSP server over stdio (tokio). Without it, only the editor features
# (hover, completion, ...) are built, e.g. for WebAssembly.
server = ["dep:serde_json", "dep:stir_project", "dep:tokio", "dep:tower-lsp-server", "dep:tracing"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
