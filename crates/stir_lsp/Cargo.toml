[package]
name = "stir_lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
line-index = "0.1.2"
ls-types = "0.0.6"
rustc-hash = "2.1.3"
salsa = "0.28.5"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = { version = "0.10.9", optional = true }
smol_str = "0.3.7"
stir_checker.workspace = true
stir_db.workspace = true
stir_fmt.workspace = true
stir_hir.workspace = true
stir_neon.workspace = true
stir_phpstan = { workspace = true, optional = true }
stir_project.workspace = true
stir_stubs.workspace = true
stir_syntax.workspace = true
stir_types.workspace = true
stir_vfs.workspace = true
tokio = { workspace = true, optional = true }
tower-lsp-server = { version = "0.23.0", optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["server"]
# The LSP server over stdio (tokio). Without it, the editor features and the
# session that speaks the protocol without threads are built, e.g. for WebAssembly.
server = ["dep:sha2", "dep:stir_phpstan", "stir_project/tokio", "dep:tokio", "dep:tower-lsp-server", "dep:tracing"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
