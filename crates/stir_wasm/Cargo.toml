[package]
name = "stir_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "StirPHP in the browser: check, compile, hover and complete a file (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
salsa = "0.28.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stir_checker = { version = "0.1.0", path = "../stir_checker" }
stir_db = { version = "0.1.0", path = "../stir_db" }
stir_emit = { version = "0.1.0", path = "../stir_emit" }
stir_lsp = { version = "0.1.0", path = "../stir_lsp", default-features = false }
stir_stubs = { version = "0.1.0", path = "../stir_stubs" }
stir_syntax = { version = "0.1.0", path = "../stir_syntax" }
wasm-bindgen = "=0.2.129"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
