[package]
name = "stir_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "StirPHP in the browser: check, compile, hover and complete a file (WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
salsa = "0.28.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
stir_checker.workspace = true
stir_db.workspace = true
stir_emit.workspace = true
stir_lsp.workspace = true
stir_stubs.workspace = true
stir_syntax.workspace = true
wasm-bindgen = "=0.2.129"

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
