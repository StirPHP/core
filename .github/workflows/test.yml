# Runs the workspace tests on every push and pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the PHP stubs
        run: git submodule update --init --depth 1 crates/stir_stubs/phpstorm-stubs
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: The WebAssembly build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p stir_wasm --target wasm32-unknown-unknown
