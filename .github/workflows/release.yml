# A release for every `v*` tag: `git tag v0.1.0 && git push origin v0.1.0`
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: The tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag doesn't match the workspace version $crate" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      name: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version-less copies
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # https://github.com/StirPHP/core/releases/latest/download/sphp-<target>.tar.gz
          # always points at the newest release
          for f in sphp-"$VERSION"-*; do cp -- "$f" "sphp-${f#sphp-"$VERSION"-}"; done
          ls
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "StirPHP ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
