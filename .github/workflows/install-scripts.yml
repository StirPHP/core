# Runs install.sh and install.ps1 on every platform they support.
name: Install scripts

on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install-scripts.yml]
  pull_request:
    paths: [install.sh, install.ps1, .github/workflows/install-scripts.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: Latest release, piped
        run: |
          sh < install.sh
          "$HOME/.local/bin/stirphp" --version
      - name: Nightly in a custom directory
        env:
          STIRPHP_VERSION: nightly
          STIRPHP_INSTALL_DIR: ${{ runner.temp }}/stirphp-nightly
        run: |
          sh < install.sh
          "$STIRPHP_INSTALL_DIR/stirphp" --version | grep -q nightly
      - name: A pinned version
        env:
          STIRPHP_INSTALL_DIR: ${{ runner.temp }}/stirphp-pinned
        run: |
          # the workspace's version: the latest release, as `just bump` tags each one
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          STIRPHP_VERSION=$version sh < install.sh
          test "$("$STIRPHP_INSTALL_DIR/stirphp" --version)" = "stirphp $version"

  windows:
    name: install.ps1 (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: Latest release, through iex
        run: |
          Get-Content install.ps1 -Raw | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\stirphp\bin\stirphp.exe'
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw 'stirphp --version failed' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains (Split-Path $exe)) { throw "not on the user PATH: $userPath" }
      - name: Nightly in a custom directory
        env:
          STIRPHP_VERSION: nightly
          STIRPHP_INSTALL_DIR: ${{ runner.temp }}\stirphp-nightly
          STIRPHP_NO_MODIFY_PATH: '1'
        run: |
          Get-Content install.ps1 -Raw | Invoke-Expression
          $v = & "$env:STIRPHP_INSTALL_DIR\stirphp.exe" --version
          if ($v -notmatch 'nightly') { throw "unexpected version: $v" }
      - name: A pinned version
        env:
          STIRPHP_INSTALL_DIR: ${{ runner.temp }}\stirphp-pinned
          STIRPHP_NO_MODIFY_PATH: '1'
        run: |
          # the workspace's version: the latest release, as `just bump` tags each one
          $env:STIRPHP_VERSION = ((Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          Get-Content install.ps1 -Raw | Invoke-Expression
          $v = & "$env:STIRPHP_INSTALL_DIR\stirphp.exe" --version
          if ($v -ne "stirphp $env:STIRPHP_VERSION") { throw "unexpected version: $v" }
